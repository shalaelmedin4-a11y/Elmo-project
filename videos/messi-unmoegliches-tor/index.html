function pose(f,{x,z,speed=0,heading,phase=0,lean=0,kick=0,lunge=0,fall=0,arms=0,crouch=0,jump=0}){

    let thigh=Math.sin(ph)*0.75*amp, knee=-(Math.max(0,-Math.cos(ph))*1.1*amp+0.15+crouch*0.6);

}

function pop(u){ // 0..1 appear scale
  const x=clamp(u/0.25); return x<1? (0.6+0.55*Math.sin(x*Math.PI*0.75)) : 1; }
let ci=0, si=0;
function callout(text,cls,anchor,dx,dy,u,uOut=99){
  const e=calls[ci],l=clines[ci];ci++;
  const vis=u>0&&u<uOut; e.style.display=vis?'block':'none'; l.style.display=vis?'block':'none'; if(!vis)return;
  const [ax,ay]=proj(anchor); const bx=ax+dx, by=ay+dy;
  e.className='call '+cls; e.textContent=text;
  const w=e.offsetWidth,h=e.offsetHeight;
  e.style.left=(dx<0?bx-w:bx)+'px'; e.style.top=(by-h/2)+'px';
  e.style.opacity=clamp(u/0.15); e.style.transform=`scale(${pop(u)})`; e.style.transformOrigin=dx<0?'right center':'left center';
  const col={red:'#e8243c',green:'#2bd17e',yellow:'#ffd21f'}[cls];
  l.setAttribute('x1',ax);l.setAttribute('y1',ay);l.setAttribute('x2',bx);l.setAttribute('y2',by);l.setAttribute('stroke',col);l.style.opacity=clamp(u/0.15);
}
function stamp(text,cls,x,y,u,size=52,uOut=99){
  const e=stamps[si++]; const vis=u>0&&u<uOut; e.style.display=vis?'block':'none'; if(!vis)return;
  e.className='stamp '+cls; e.textContent=text; e.style.fontSize=size+'px';
  const w=e.offsetWidth; e.style.left=(x-w/2)+'px'; e.style.top=y+'px';
  e.style.transform=`skewX(-10deg) rotate(-4deg) scale(${u<0.18?lerp(2.2,1,ss(0,0.18,u)):1})`; e.style.opacity=clamp(u/0.08);
}
function headline(lbl,l1,l2,u,top=82){
  H.label.textContent=lbl; H.label.style.opacity=clamp(u/0.2);
  H.head.innerHTML=`${l1}<br><span class="r">${l2}</span>`; H.head.style.top=top+'px'; H.label.style.top=(top-20)+'px';
  H.head.style.opacity=clamp(u/0.12); H.head.style.transform=`translateY(${(1-ss(0,0.3,u))*14}px)`;
}
function card(src,tag,u,top=58,uOut=99){
  const vis=u>0&&u<uOut; H.card.style.display=vis?'block':'none'; if(!vis)return;
  const img=H.card.querySelector('img'); if(!img.src.endsWith(src)) img.src=src;
  H.card.querySelector('.tag').textContent=tag; H.card.style.top=top+'px';
  H.card.style.opacity=clamp(u/0.12); H.card.style.transform=`translateX(-50%) rotate(-1.2deg) scale(${lerp(0.85,1,ss(0,0.25,u))})`;
}

// ---------- camera presets ----------
const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
function setCam(p,t,fov=42){camera.position.copy(p);camera.lookAt(t);camera.fov=fov;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);}

// ---------- per-frame ----------
window.renderAt=function(t){
  camera.up.set(0,1,0);
  let sc=SCENES[SCENES.length-1]; for(const s of SCENES){if(t>=s.start&&t<s.start+s.dur){sc=s;break;}}
  const u=t-sc.start, U=u/sc.dur;
  // reset HUD
  ci=0;si=0; for(const k of ['label','head','badge','meter','cta','sub']) H[k].style.display='none';
  H.card.style.display='none'; H.label.style.display=H.head.style.display='block';
  let A=-2, slow=false, dim=0, flash=0;
  let fx={side:0,danger:0,gap:0,wedge:0,pen:0,kcov:0,route:0,glow:0,trail:false};
  const id=sc.id;
  if(id==='hook'){A=9.75+u*0.38; slow=true;}
  else if(id==='setup'){A=-2;}
  else if(id==='receive'){A=-2+u*(4.3/sc.dur);}
  else if(id==='space'){A=2.3+ss(0,1,U)*2.3;}
  else if(id==='trick'){A=4.6+ (U<0.55? U/0.55*0.9 : 0.9+(U-0.55)/0.45*1.9); slow=U<0.55;}
  else if(id==='fourth'){A=7.4+U*2.75;}
  else if(id==='angle'){A=SHOT-0.08;}
  else if(id==='shot'){A=u<2.6? SHOT-0.25+u*0.06 : SHOT-0.1+(u-2.6)*0.36; slow=u>=2.6;}
  else if(id==='result'){A=11.4+u*0.9;}
  else {A=11.4+(sc.id==='cta'?SCENES[8].dur:SCENES[8].dur+SCENES[9].dur)*0.9+u*0.9;}

  // figures
  let mx;
  {const kick=ss(SHOT-0.18,SHOT,A)*(1-ss(SHOT+0.12,SHOT+0.4,A));
   const cel=ss(11.3,11.8,A); const jump=A>11.3?Math.abs(Math.sin(A*5))*0.15*cel*(A>14?1:0.3):0;
   mx=drive(messi,MK,A,{kick:kick>0?kick:0,arms:cel*0.55,jump});}
  def.forEach((f,i)=>{const [a,b]=LUNGE[i];const l=ss(a,(a+b)/2,A)*(1-ss((a+b)/2+0.2,b+0.5,A));
    const beaten = i<3? ss(5.9,6.6,A)*0.4*(1-ss(7,8,A)) : ss(10,10.4,A)*0.5*(1-ss(11,12,A));
    drive(f,DK[i],A,{lunge:Math.max(l,beaten),crouch:0.25*(1-l)});
    // face messi
    if(A<12){const [px,pz]=track(MK,A);const [dx,dz]=track(DK[i],A);if(Math.hypot(px-dx,pz-dz)<9) {f.root.rotation.y=-Math.atan2(pz-dz,px-dx);}}
  });
  {const dive=ss(SHOT+0.08,SHOT+0.45,A); const [x,z]=track(GK,A); const [px,pz]=track(MK,Math.min(A,SHOT));
   pose(gk,{x,z:z+dive*0.6,speed:0,heading:Math.atan2(pz-z,px-x),crouch:0.45*(1-dive),arms:0.5,phase:0});
   gk.body.rotation.x=-dive*1.1; gk.body.position.y=dive*0.25;}
  extrasA.forEach(({f,p},i)=>{const [mx2,mz2]=track(MK,Math.min(A,11));const k=clamp((A+2)/14)*0.35;const x=lerp(p[0],mx2,k*0.5),z=lerp(p[1],mz2,k*0.5);pose(f,{x,z,speed:A<11?3:0.5,heading:Math.atan2(mz2-z,mx2-x),phase:A*7+i});});
  extrasB.forEach(({f,p},i)=>{const x=p[0]+clamp(A/12)*4,z=p[1];pose(f,{x,z,speed:A<11?3:0.5,heading:0.2,phase:A*7+i*2});});

  // ball
  let bp;
  if(A<SHOT){const [x,z]=track(MK,A);const h=messi.heading;const dr=0.55+0.18*Math.sin(A*9);bp=new THREE.Vector3(x+Math.cos(h)*dr,0.13,z+Math.sin(h)*dr);}
  else if(A<BALL_IN){const s=ss(SHOT,BALL_IN,A)*0.3+((A-SHOT)/(BALL_IN-SHOT))*0.7;const [x,z]=track(MK,SHOT);const h=Math.atan2(NEAR.z-z,NEAR.x-x);const st=new THREE.Vector3(x+Math.cos(h)*0.5,0.13,z+Math.sin(h)*0.5);bp=st.clone().lerp(NEAR,s);bp.y+=Math.sin(s*Math.PI)*0.35;}
  else {const s=ss(BALL_IN,BALL_IN+0.25,A);bp=NEAR.clone().lerp(NET,s);bp.y=lerp(NEAR.y,0.13,ss(BALL_IN+0.2,BALL_IN+0.7,A));}
  ball.position.copy(bp);
  // trail
  if(A>SHOT && (id==='hook'||id==='shot')){const pts=[];const [x,z]=track(MK,SHOT);const h=Math.atan2(NEAR.z-z,NEAR.x-x);const st=new THREE.Vector3(x+Math.cos(h)*0.5,0.13,z+Math.sin(h)*0.5);const upto=clamp((A-SHOT)/(BALL_IN-SHOT));for(let s=0;s<=upto;s+=0.04){const p=st.clone().lerp(NEAR,s);p.y+=Math.sin(s*Math.PI)*0.35;pts.push(p.x,p.y,p.z);}trailGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));trail.visible=true;} else trail.visible=false;
  const goalHit=ss(BALL_IN-0.05,BALL_IN+0.05,A)*(1-ss(BALL_IN+0.3,BALL_IN+1.0,A));

  // camera + HUD per scene
  const M=new THREE.Vector3(mx.x,0,mx.z);
  if(id==='hook'){
    setCam(new THREE.Vector3(M.x-4.5-u*0.4,1.7,M.z+3.8),new THREE.Vector3(G,0.8,3.2),38);
    headline('COPA DEL REY · FINALE 2015','DIESES TOR','WAR UNMÖGLICH.',u/sc.dur*2.2);
    H.badge.style.display='block'; H.badge.textContent='SLOW MOTION ×0.35';
    callout('MESSI','green',new THREE.Vector3(M.x,2.0,M.z),-30,-40,u-0.4);
    if(goalHit>0){glow.position.copy(NEAR);glow.scale.setScalar(2.5+goalHit*2);glow.material.opacity=goalHit;}
    stamp('TOR!','yellow',300,520,(A-BALL_IN-0.05)/1.2,70);
    flash=Math.max(0,1-Math.abs(t-sc.dur+0.05)/0.12)*0.85;
  } else if(id==='setup'){
    camera.up.set(1,0,0);
    setCam(new THREE.Vector3(19+U*2,80-U*6,18.5),new THREE.Vector3(19+U*2,0,18.51),44);
    headline('POKALFINALE · CAMP NOU','30. MAI 2015.','BARÇA – ATHLETIC.',u/sc.dur*2);
    card('img/card_wide.jpg','BARCELONA VS ATHLETIC · 20. MIN',u-0.15,500,3.9);
    stamp("20'",'yellow',440,150,(u-2.0)/1.5,58);
    stamp('0 : 0','grey',440,230,(u-3.0)/1.5,44);
    fx.route=ss(4.0,7.5,u);
    callout('MESSI','green',new THREE.Vector3(M.x,0,M.z),-20,40,u-4.0);
  } else if(id==='receive'){
    setCam(new THREE.Vector3(M.x-8,5.5,M.z-8),new THREE.Vector3(M.x+1.5,0.2,M.z+0.5),44);
    headline('DER START','RECHTE','SEITENLINIE.',u/sc.dur*2);
    callout('MESSI','green',new THREE.Vector3(M.x,2.0,M.z),40,-50,u-0.5);
    callout('MITTELLINIE','yellow',new THREE.Vector3(0,0,24),-20,40,u-1.2,3.6);
    fx.route=1-ss(0,0.8,u);
    stamp('50+ METER','yellow',290,400,(u-3.4)/1.2,50);
  } else if(id==='space'){
    const o=U*0.6;
    setCam(new THREE.Vector3(M.x-7+o*3,16,M.z-13),new THREE.Vector3(M.x+2,0,M.z-0.6),40);
    headline('PROBLEM 1','KEIN','PLATZ.',u/sc.dur*2.2);
    fx.danger=ss(0.8,1.8,u); fx.side=ss(3.0,4.0,u);
    def.slice(0,3).forEach((f,i)=>{const p=f.root.position;callout('GEGNER '+(i+1),'red',new THREE.Vector3(p.x,2.0,p.z),[-30,-10,40][i],[-40,-70,-40][i],u-1.0-i*0.45);});
    callout('SEITENLINIE ✕','red',new THREE.Vector3(M.x+6,0,34),20,50,u-3.2);
    card('img/card_side.jpg','DREI GEGEN EINEN · ORIGINAL',u-5.0,640);
  } else if(id==='trick'){
    setCam(new THREE.Vector3(M.x-4,6,M.z-9),new THREE.Vector3(M.x+1.5,0.4,M.z+0.5),42);
    headline('DER TRICK','ER BLEIBT','FAST STEHEN.',u/sc.dur*2.2);
    H.meter.style.display='block'; H.meter.querySelector('.fill').style.width=(clamp(mx.v/8)*100)+'%';
    H.meter.querySelector('.fill').style.background=mx.v<3?'#e8243c':'#38e08c';
    if(slow){H.badge.style.display='block';H.badge.textContent='SLOW MOTION ×0.3';}
    fx.gap=ss(0.45,0.55,U)*(1-ss(0.85,0.95,U));
    callout('GREIFEN AN','red',new THREE.Vector3(14.5,2,29),-30,-50,u-1.6,sc.dur*0.6);
    callout('DIE LÜCKE','green',new THREE.Vector3(15,0.2,29.75),30,60,(U-0.5)*sc.dur,sc.dur*0.85);
    stamp('BOOM 💥','yellow',300,470,(U-0.58)*sc.dur/1.2,54);
  } else if(id==='fourth'){
    setCam(new THREE.Vector3(M.x-6.5,4.5,M.z+6),new THREE.Vector3(M.x+3,0.3,M.z-2.5),44);
    headline('IM STRAFRAUM','GEGNER','NUMMER 4.',u/sc.dur*2);
    const p=def[3].root.position;
    callout('GEGNER 4','red',new THREE.Vector3(p.x,2,p.z),30,-50,u-0.6);
    stamp('4 / 4','yellow',290,460,(U-0.72)*sc.dur/1.2,56);
  } else if(id==='angle'){
    setCam(new THREE.Vector3(36+U*1.5,20,20),new THREE.Vector3(48,0,6.5),40);
    headline('PROBLEM 2','KEIN','WINKEL.',u/sc.dur*2);
    fx.wedge=ss(1.2,2.0,u); fx.pen=ss(4.2,5.0,u); fx.kcov=ss(2.4,3.2,u)*(1-ss(4.2,5,u)*0.5);
    stamp('≈ 16°','green',150,330,(u-1.6)/1.2,62);
    callout('MESSI','green',new THREE.Vector3(shotPos[0],0,shotPos[1]),-20,50,u-0.3);
    callout('TORWART','red',new THREE.Vector3(51.5,0,2.4),25,-40,u-2.6);
    callout('ELFMETERPUNKT · 37°','yellow',new THREE.Vector3(G-11,0,0),-15,70,u-4.4);
  } else if(id==='shot'){
    setCam(new THREE.Vector3(G-0.6,1.6,-2.4+u*0.04),new THREE.Vector3(45,0.6,10.5),38);
    headline('DER ABSCHLUSS','UND TROTZDEM:','KURZES ECK.',u/sc.dur*2.2);
    if(slow){H.badge.style.display='block';H.badge.textContent='SLOW MOTION ×0.35';}
    callout('TORWART','red',new THREE.Vector3(gk.root.position.x,2.0,gk.root.position.z),-30,-50,u-0.6,4.0);
    callout('KURZES ECK','green',new THREE.Vector3(G,1.2,GW),30,-60,u-1.3,4.2);
    if(goalHit>0){glow.position.copy(NEAR);glow.scale.setScalar(1.2+goalHit*1.4);glow.material.opacity=goalHit;}
    stamp('TOR!','yellow',270,470,(A-BALL_IN-0.05)/1.0,80);
  } else if(id==='result' || id==='cta' || id==='outro'){
    const a=t*0.18;
    setCam(new THREE.Vector3(M.x+Math.cos(a)*7,2.6,M.z+Math.sin(a)*7-2),new THREE.Vector3(M.x,1.1,M.z),42);
    if(id==='result'){
      headline('DIE FOLGEN','3:1, TRIPLE','& PUSKÁS #2.',u/sc.dur*2,300);
      card('img/card_cel.jpg','LIONEL MESSI · 27',u-0.1);
      stamp('PLATZ 2','yellow',380,420,(u-4.2)/1.2,52);
    } else if(id==='cta'){
      H.label.style.display=H.head.style.display='none';
      H.cta.style.display='block'; H.cta.innerHTML='SCHICK DAS<br>EINEM FREUND,<br><span class="r">DER KICKT! ⚽</span>';
      H.cta.style.top='120px'; H.cta.style.opacity=clamp(u/0.25); H.cta.style.transform=`translateY(${(1-ss(0,0.4,u))*14}px)`;
      dim=0.25;
    } else {
      H.label.style.display=H.head.style.display='none';
      H.cta.style.display='block'; H.cta.innerHTML='TEIL DAS<br>FÜR<br><span class="r">MESSI. 🐐</span>'; H.cta.style.top='300px'; H.cta.style.opacity=clamp(u/0.3);H.cta.style.transform='none';
      H.sub.style.display='block'; H.sub.textContent='FOLG MIR FÜR MEHR ECHTE ANALYSEN'; H.sub.style.top='480px'; H.sub.style.opacity=clamp((u-0.3)/0.3);
      dim=0.72*ss(0,0.5,u);
    }
  }
  // fx apply
  sideMat.opacity=fx.side*(0.55+0.25*Math.sin(t*8));
  danger.position.set(M.x,0.03,M.z);dangerFill.position.set(M.x,0.025,M.z);
  danger.material.opacity=fx.danger*0.9; dangerFill.material.opacity=fx.danger*(0.12+0.06*Math.sin(t*6));
  gapMat.opacity=fx.gap*0.55;
  wedgeMessi.material.opacity=fx.wedge*0.35; raysMessi.material.opacity=fx.wedge;
  wedgePen.material.opacity=fx.pen*0.22; raysPen.material.opacity=fx.pen*0.8;
  kcov.material.opacity=fx.kcov*0.35;
  if(fx.route>0){const n=Math.floor(routeAll.length/3*fx.route);routeGeo.setAttribute('position',new THREE.Float32BufferAttribute(routeAll.slice(0,n*3),3));route.visible=true;} else route.visible=false;
  if(!((id==='hook'||id==='shot')&&goalHit>0)) glow.material.opacity=0;
  // hide unused
  for(let i=ci;i<calls.length;i++){calls[i].style.display='none';clines[i].style.display='none';}
  for(let i=si;i<stamps.length;i++) stamps[i].style.display='none';
  // sun follows
  sun.position.set(M.x-15,40,M.z-20); sun.target.position.copy(M);
  document.getElementById('dim').style.opacity=dim;
  // scene-change flash/fade
  const sinceStart=u, toEnd=sc.dur-u;
  document.getElementById('flash').style.opacity=Math.max(flash, sinceStart<0.12&&sc.id!=='hook'? (0.12-sinceStart)/0.12*0.35:0);
  renderer.render(scene,camera);
};
window.READY=new Promise(r=>{const img=new Image();img.onload=()=>document.fonts.ready.then(()=>setTimeout(r,300));img.src='img/face_round.png';});
</script>
