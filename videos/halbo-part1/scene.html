const WALK1=[[23.0,HALBO_SEAT.x,HALBO_SEAT.z],[24.2,HALBO_SEAT.x-0.55,HALBO_SEAT.z],[25.2,2.9,2.6],[26.3,1.3,1.0],[27.3,0.95,0.55],[28.4,0.0,-0.2],[30.0,0.0,-0.25],[31.4,-3.9,-2.8]];
function path(keys,t){if(t<=keys[0][0])return[keys[0][1],keys[0][2]];for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0]){const u=ss(a[0],b[0],t)*0.5+((t-a[0])/(b[0]-a[0]))*0.5;return[lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}}const k=keys[keys.length-1];return[k[1],k[2]];}
function pathDist(keys){const T=[];let d=0,[px,pz]=path(keys,keys[0][0]);for(let t=keys[0][0];t<=keys[keys.length-1][0]+0.02;t+=0.02){const[x,z]=path(keys,t);d+=Math.hypot(x-px,z-pz);px=x;pz=z;T.push(d);}return t=>T[clamp(Math.round((t-keys[0][0])/0.02),0,T.length-1)];}
const OUT=[[32.0,5.6,-2.0],[33.2,7.8,1.5],[35.4,CB.x-0.2,CB.z+1.55]];   // outside: from school door to car B driver door
const DRAG=[[38.6,CB.x-0.4,CB.z+1.7],[41.2,7.3,13.6]];
const dW1=pathDist(WALK1),dOut=pathDist(OUT),dDrag=pathDist(DRAG);
const head=(keys,t)=>{const[a,b]=path(keys,t-0.05),[c,d]=path(keys,t+0.05);return Math.hypot(c-a,d-b)>1e-4?Math.atan2(d-b,c-a):null;};
const spd=(keys,t)=>{const[a,b]=path(keys,t-0.05),[c,d]=path(keys,t+0.05);return Math.hypot(c-a,d-b)/0.1;};
const MATE_WIN=SEATS.map((s,i)=>[4.05-(i%2)*0.55,[-2.6,-1.8,-0.9,0.0,0.8,1.6,2.4,3.0,-2.2,0.4,2.0,-1.3,1.2][i%13]]);

// ---------- post: grade (blue freeze world), vignette, fade ----------
const composer=new EffectComposer(renderer);composer.setPixelRatio(2);composer.setSize(540,960);
const rp=new RenderPass(scene,camera);composer.addPass(rp);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(540,960),0.25,0.6,0.9));
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},freeze:{value:0},black:{value:0},white:{value:0},dream:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tDiffuse;uniform float freeze,black,white,dream;varying vec2 vUv;
 void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.299,.587,.114));
  vec3 cold=mix(c.rgb,vec3(l)*vec3(.62,.78,1.08),0.72);c.rgb=mix(c.rgb,cold,freeze);
  c.rgb=mix(c.rgb,c.rgb*vec3(1.05,1.03,.96)+0.04,dream);
  float v=smoothstep(.95,.35,length(vUv-.5)*1.25);c.rgb*=mix(1.,v,.35+freeze*.25);
  c.rgb=mix(c.rgb,vec3(1.),white);c.rgb*=1.-black;gl_FragColor=c;}`});
composer.addPass(grade);composer.addPass(new OutputPass());

function cam(p,t,fov=38){camera.position.copy(p);camera.lookAt(t);camera.fov=fov;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);}
function shadowAround(c,r){sun.target.position.copy(c);sun.position.copy(c).add(V(16,22,-6));const s=sun.shadow.camera;s.left=-r;s.right=r;s.top=r;s.bottom=-r;s.near=1;s.far=80;s.updateProjectionMatrix();}
const blinkAt=(t,off)=>{const p=(t+off)%3.7;return p<0.12?Math.sin(p/0.12*Math.PI):0;};

// ---------- frame ----------
window.renderAt=function(t){
  const wt=worldTime(t),frozen=t>=IMPACT&&t<RESUME;
  const fz=ss(IMPACT,IMPACT+0.6,t)*(1-ss(RESUME-0.5,RESUME,t));
  // ---- cars ----
  const vA=16;
  let ax=CB.x+1.6,az,aRot=0,bx=CB.x,bz=CB.z,bRot=0,crush=0;
  if(wt<IMPACT){az=CB.z-0.9-2.1-vA*(IMPACT-wt);}else{const k=clamp((wt-IMPACT)/1.2);const e=1-Math.pow(1-k,3);az=CB.z-3.0+e*2.6;bz=CB.z+e*2.4;bRot=e*0.55;aRot=-e*0.25;crush=ss(IMPACT,IMPACT+0.15,wt);}
  carA.position.set(ax,GROUND,az);carA.rotation.y=-Math.PI/2+aRot;carA.scale.set(1-crush*0.12,1,1);
  carB.position.set(bx,GROUND,bz);carB.rotation.y=Math.PI+bRot;
  carA.userData.wheels.forEach(w=>w.rotation.y=wt*vA/0.36*(wt<IMPACT?1:0));
  doorPivot.rotation.y=-ss(35.6,36.5,t)*1.25;
  // glass shards after impact (only in running time)
  {const age=wt-IMPACT;const p=glassGeo.attributes.position;shards.visible=age>0&&age<1.6&&!frozen;if(shards.visible){for(let i=0;i<NG;i++){const v=glassV[i];p.setXYZ(i,CB.x+v[0]*age*1.5+0.8,GROUND+Math.max(0.03,1.1+v[1]*age-4.9*age*age),CB.z-1+v[2]*age*1.5);}p.needsUpdate=true;}}
  // ---- clock ----
  const ct=frozen?IMPACT:wt;clock.userData.s.rotation.z=-Math.floor(ct)*Math.PI/30;clock.userData.m.rotation.z=-(10+ct/60)*Math.PI/30;clock.userData.h.rotation.z=-(10.2)*Math.PI/6;
  mates.forEach(m=>m.wrap.visible=t>=10);teacher.wrap.visible=t>=10;
  // ---- teacher ----
  {const shout1=ss(TL.t1-0.3,TL.t1,t)*(1-ss(TL.t1+2.2,TL.t1+2.8,t)),shout2=ss(TL.t2-0.3,TL.t2,t);
   const look=frozen?0:(t>RESUME+0.3&&t<58.4?1:0);
   const idleT=frozen?IMPACT:wt;
   teacher.pose({x:TEACH.x,z:TEACH.z,heading:Math.PI/2-look*0.9,speed:0,t:idleT,point:shout1*0.9,lean:shout1*0.12,headYaw:-0.35*(shout1+shout2),
     mouth:lip('teacher',t),blink:frozen?0:blinkAt(t,1.3),handsMouth:look*ss(RESUME+0.1,RESUME+0.5,t)*0.6});}
  // ---- classmates ----
  mates.forEach((m,i)=>{const[sx,sz]=SEATS[i];const idleT=(frozen?IMPACT:wt)+i*0.7;
    const turn=ss(10.3,11.0,t)*(1-ss(13.6,14.6,t));const ang=Math.atan2(HALBO_SEAT.z-sz,HALBO_SEAT.x-sx);
    const scream=ss(RESUME+0.15,RESUME+0.45,t);
    if(t<RESUME+0.9){m.pose({x:sx,z:sz+0.42,heading:-Math.PI/2,speed:0,t:idleT,sit:1,armsDesk:0.8*(1-scream),handsMouth:scream*0.9,torsoYaw:-turn*0.35*Math.sign(ang+Math.PI/2),headYaw:-turn*0.55,blink:frozen?0:blinkAt(t,i*0.9),
      headPitch:i%4==1?0.15:0});}
    else{const[wx,wz]=MATE_WIN[i];const k=ss(RESUME+0.9,RESUME+3.2+i*0.12,t);const x=lerp(sx,wx,k),z=lerp(sz+0.42,wz,k);const h=k<0.98?Math.atan2(wz-sz-0.42,wx-sx):0;
      m.pose({x,z,heading:h,speed:k>0.02&&k<0.98?2.4:0,dist:k*Math.hypot(wx-sx,wz-sz)+i,t:idleT,sit:1-ss(RESUME+0.9,RESUME+1.4,t),handsMouth:(1-k)*0.6,headPitch:k>0.95?0.35:0,blink:blinkAt(t,i*0.9)});}});
  // ---- driver (in car B, later on the pavement) ----
  {const inCar=t<36.6;const pulled=ss(36.6,38.6,t);
   if(inCar){const w=carB.localToWorld(V(-0.2,0.0,0.45));driver.pose({x:w.x,z:w.z,y:GROUND+0.1,heading:Math.PI-carB.rotation.y+Math.PI,speed:0,t:frozen?IMPACT:wt,sit:1,armsFwd:0.7,blink:frozen?0:blinkAt(t,2.1)});}
   else if(t<RESUME+3){const[px,pz]=t<DRAG[0][0]?[CB.x-0.4,CB.z+1.2+pulled*0.5]:path(DRAG,t);const lay=ss(41.0,42.0,t);
     driver.pose({x:px+0.7*(1-lay),z:pz+0.2,y:GROUND+0.1,heading:Math.PI*0.5,speed:0,t:0,lie:lay*0.98+(1-lay)*0.55,limp:1,blink:1});}
   else{const mv=ss(RESUME+3.5,RESUME+5,t);const[px,pz]=DRAG[1].slice(1);driver.pose({x:px,z:pz+0.2,y:GROUND+0.1,heading:Math.PI*0.5,speed:0,t:wt,lie:0.98-mv*0.18,limp:1-mv,reach:mv*0.6*(0.5+0.5*Math.sin(t*2)),blink:mv>0.5?blinkAt(t,0.4):1,headYaw:mv*0.4});}}
  // ---- Halbo ----
  let H={x:HALBO_SEAT.x,z:HALBO_SEAT.z,heading:-Math.PI/2,speed:0,t:wt,blink:blinkAt(t,0.2)};
  const startle=ss(12.0,12.35,t);
  if(t<23.0){const look=ss(13.8,14.6,t);Object.assign(H,{sit:1,chin:1-startle,armsDesk:startle,headYaw:-0.95*(1-startle)-look*1.0+(t>20.5?ss(20.5,21.5,t)*1.6:0),headPitch:0.05*(1-startle)+look*0.35*(1-(t>20.5?ss(20.5,21.5,t):0)),lean:-startle*0.08*(1-ss(12.6,13.5,t)),eyeYaw:-0.3*(1-startle),mouth:lip('halbo',t),blink:t<6?blinkAt(t,0.2)*0.6:blinkAt(t,0.2)});
    if(t>16.5&&t<IMPACT)H.blink=0;}
  else if(t<31.4){const up=ss(23.0,24.0,t);const[x,z]=path(WALK1,t);const hh=head(WALK1,t);const v=spd(WALK1,t);
    const tap=ss(26.9,27.2,t)*(1-ss(27.5,27.9,t));const around=ss(28.4,28.8,t)*(1-ss(29.8,30.1,t));
    Object.assign(H,{x,z,heading:hh??(t<26?-Math.PI/2:-Math.PI*0.75),speed:t<24.1?0:v,dist:dW1(t),sit:1-up,lean:(1-up)*0.25*up*4,reach:tap,headYaw:around*Math.sin((t-28.4)*3.2)*0.9,torsoYaw:around*Math.sin((t-28.4)*3.2)*0.3});}
  else if(t<35.6){const[x,z]=path(OUT,t);Object.assign(H,{x,z,y:GROUND,heading:head(OUT,t)??0.6,speed:spd(OUT,t),dist:dOut(t)});}
  else if(t<38.6){const pull=ss(36.6,38.4,t);Object.assign(H,{x:CB.x-0.2,z:CB.z+1.55+pull*0.3,y:GROUND,heading:-Math.PI/2,speed:0,reach:ss(35.5,35.9,t)*(1-ss(36.4,36.6,t)),bend:ss(36.4,36.8,t)*0.7,armsFwd:ss(36.4,36.8,t)});}
  else if(t<42.0){const[x,z]=path(DRAG,t);const hh=head(DRAG,t);Object.assign(H,{x,z,y:GROUND,heading:(hh??0)+Math.PI,speed:spd(DRAG,t)*0.9,dist:-dDrag(t),bend:0.7-ss(41.2,42,t)*0.1,armsFwd:1});}
  else{const tw=ss(59.0,60.1,t);Object.assign(H,{x:4.0,z:2.55,heading:0-tw*2.2,speed:0,t:t,mouth:lip('halbo',t),lean:-ss(TL.h2-0.1,TL.h2+0.2,t)*0.1*(1-ss(TL.h2+0.6,TL.h2+1.2,t)),headPitch:ss(43,43.5,t)*0.45*(1-ss(51.5,52.5,t)),blink:t>51.8&&t<58.6?0:blinkAt(t,0.2),eyeYaw:t>51.8&&t<58.9?Math.sin(t*0.9)*0.08:0});}
  halbo.pose(H);
  // ---- swimmer (daydream) ----
  waterU.time.value=t;swimmer.pose({x:-0.4+(t-7.4)*0.6,z:0,y:-0.12,heading:0,speed:0,t:0,lie:1,swim:1,swimPh:t*3.4,blink:0,headPitch:-0.5});

  window.__dbg={sw:swimmer.headPos().toArray().map(v=>+v.toFixed(2)),cam:null};
  // ---- shots ----
  let useSea=false,black=0,white=0;const hp=halbo.headPos();
  if(t<3.2){cam(V(2.3,1.25,1.7).lerp(V(2.55,1.22,2.0),t/3.2),V(3.75,1.05,3.65),34);shadowAround(V(2,0,1),8);}
  else if(t<6.0){const u=(t-3.2)/2.8;cam(V(6.6,1.75,3.95-u*0.1),V(3.7,1.0,3.75),28);shadowAround(V(3,0,3),8);}
  else if(t<7.45){const u=(t-6)/1.45;cam(V(5.6-u*0.4,1.25,3.0),hp.clone().add(V(0,-0.06,0)),24);shadowAround(V(3,0,3),8);}
  else if(t<9.45){useSea=true;const u=(t-7.45)/2;const sp=swimmer.headPos();cam(V(sp.x+4.5-u*0.8,1.9,6.5),sp.clone().add(V(-0.3,-0.2,0)),30);white=Math.max(0,1-(t-7.45)/0.25)*0.9+ss(9.2,9.45,t)*0.9;}
  else if(t<10.0){cam(V(5.2,1.25,3.0),hp.clone().add(V(0,-0.06,0)),24);white=(1-ss(9.45,9.7,t))*0.9;shadowAround(V(3,0,3),8);}
  else if(t<12.05){const u=(t-10)/2.05;cam(V(-3.7,1.85,4.1).lerp(V(-3.5,1.75,3.8),u),V(0.2,1.1,-2.0),40);shadowAround(V(0,0,0),9);}
  else if(t<14.0){cam(V(2.45,1.25,2.05),hp.clone().add(V(0.05,-0.12,0)),32);shadowAround(V(3,0,3),8);}
  else if(t<15.6){cam(V(2.45,1.3,2.2),hp.clone().add(V(0.15,-0.1,0)),30);shadowAround(V(3,0,3),8);}
  else if(t<16.6){cam(V(6.3,0.9,1.5),V(11.5,GROUND+0.5,7.5),44);shadowAround(V(10,GROUND,4),18);}
  else if(t<IMPACT){const u=(t-16.6)/2.4;cam(V(7.4,GROUND+1.5,4.2+u*0.6),V(11.5,GROUND+0.9,9.2),42);shadowAround(V(10,GROUND,8),14);}
  else if(t<21.2){const a=-0.8+(t-IMPACT)*0.18;cam(V(CB.x+Math.cos(a)*9,GROUND+2.6,CB.z-1+Math.sin(a)*9),V(CB.x+0.4,GROUND+0.9,CB.z-1),36);shadowAround(V(CB.x,GROUND,CB.z),12);}
  else if(t<23.0){cam(V(-1.5,2.4,-3.6),V(2.0,0.9,2.6),40);shadowAround(V(0,0,0),9);}
  else if(t<25.2){cam(V(2.0,1.3,4.0),hp.clone().add(V(0,-0.25,0)),36);shadowAround(V(3,0,3),8);}
  else if(t<27.9){const u=(t-25.2)/2.7;cam(V(-0.6,1.5,2.4).lerp(V(-0.8,1.45,1.3),u),V(H.x,1.1,H.z),38);shadowAround(V(1,0,1),8);}
  else if(t<30.2){const a=(t-27.9)*0.5;cam(V(H.x+Math.cos(a)*2.6,1.55,H.z+Math.sin(a)*2.6),V(H.x,1.2,H.z),40);shadowAround(V(0,0,0),8);}
  else if(t<31.6){cam(V(1.6,1.75,1.2),V(-3.6,1.0,-2.6),40);shadowAround(V(-2,0,-1),8);}
  else if(t<35.5){cam(V(9.8,GROUND+5.0,-6.5),V(H.x+0.5,GROUND+0.8,H.z+1.5),40);shadowAround(V(8,GROUND,4),16);}
  else if(t<38.6){cam(V(CB.x-3.8,GROUND+1.7,CB.z+5.2),V(CB.x-0.3,GROUND+1.0,CB.z+1.0),38);shadowAround(V(CB.x,GROUND,CB.z+2),10);}
  else if(t<42.0){cam(V(H.x+3.2,GROUND+2.4,H.z+4.2),V(H.x-0.3,GROUND+0.6,H.z),38);shadowAround(V(9,GROUND,13),10);}
  else if(t<RESUME){cam(V(6.2,1.5,2.9),hp.clone().add(V(0,-0.08,0)),26);shadowAround(V(3,0,2),8);}
  else if(t<44.6){cam(V(7.2,GROUND+1.4,5.6),V(11.2,GROUND+0.9,10.5),42);shadowAround(V(10,GROUND,9),14);}
  else if(t<46.0){cam(V(-3.6,1.9,-3.4),V(2.6,1.0,1.6),42);shadowAround(V(0,0,0),9);}
  else if(t<49.2){cam(V(6.4,0.6,6.0),V(7.3,GROUND+0.3,13.6),30);shadowAround(V(8,GROUND,12),10);}
  else if(t<51.8){cam(V(6.2,1.5,3.0),hp.clone().add(V(0,-0.05,0)),26);shadowAround(V(3,0,2),8);}
  else if(t<58.9){const u=(t-51.8)/7.1;const e=halbo.eyeWorld(0).add(halbo.eyeWorld(1)).multiplyScalar(0.5);const f=V(Math.cos(H.heading),0,Math.sin(H.heading));
    cam(e.clone().add(f.clone().multiplyScalar(lerp(1.5,0.95,u))).add(V(0,0.01,0)),e,lerp(16,10,u));shadowAround(V(3,0,2),8);}
  else{cam(V(3.0,1.6,1.25),hp.clone().add(V(0.1,-0.2,0)),34);shadowAround(V(3,0,2),8);black=ss(60.1,60.25,t);}
  // end card
  const endOn=t>=60.25;document.getElementById('end').style.opacity=endOn?clamp((t-60.35)/0.5):0;
  rp.scene=useSea?sea:scene;
  grade.uniforms.freeze.value=useSea?0:fz;grade.uniforms.black.value=endOn?1:black;grade.uniforms.white.value=white;grade.uniforms.dream.value=useSea?1:0;
  window.__dbg.cam=camera.position.toArray().map(v=>+v.toFixed(2));
  composer.render();
};
</script>
